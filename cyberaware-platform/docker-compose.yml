services:
  web:
    build: .
    # Load all environment variables from .env (copy .env.example → .env first)
    env_file: .env
    ports:
      # host:container — host port is configurable (macOS reserves 5000 for AirPlay).
      # Override with HOST_PORT in .env if 8000 is taken. Container stays 5000.
      - "${HOST_PORT:-8000}:5000"
    volumes:
      # Persist the SQLite database across container restarts
      - cyberaware_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  cyberaware_data:
